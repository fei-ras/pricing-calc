<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Price calculator for manufactured goods</title>
</head>
<body class="bg-base-200 min-h-screen p-4 md:p-8">
    
    <div class="max-w-4xl mx-auto card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-3xl mb-4 ">Price calculator for manufactured goods</h2>
            
            <div class="overflow-x-auto">
                <table class="table w-full" id="partsTable">
                    <thead>
                        <tr class="border-b border-base-300">
                            <th class="w-2/3 text-xs uppercase tracking-widest opacity-60">Part Name</th>
                            <th class="w-24 text-xs uppercase tracking-widest opacity-60 text-right">Cost</th>
                            <th class="w-16"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-base-200" id="partsTableBody">
                        <tr>
                            <td><input type="text" placeholder="Item/Part Name" class="input input-bordered input-md w-full part-name" /></td>
                            <td>
                                <div class="join w-full justify-end">
                                    <span class="join-item btn btn-md no-animation bg-base-200 border-base-300 pointer-events-none">$</span>
                                    <input type="number" step="0.01" placeholder="0.00" class="join-item input input-bordered input-md w-32 text-right part-cost" />
                                </div>
                            </td>
                            <td class="text-center">
                            </td>
                            <td class="text-center">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="divider my-8 text-xs uppercase tracking-widest opacity-40">Labor</div>

            <div class="flex flex-col md:flex-row items-center justify-between gap-8 mb-8">

                <div class="flex items-center gap-3 w-full">
                    <span class="text-xs uppercase tracking-widest opacity-60 whitespace-nowrap">Hourly Rate</span>
                    <div class="join w-full">
                        <span class="join-item btn btn-md no-animation bg-base-200 border-base-300 pointer-events-none">$</span>
                        <input type="number" id="hourlyRate" value="65" class="join-item input input-bordered w-full" oninput="window.calculate()" />
                    </div>
                </div>

                <div class="flex items-center gap-3 w-full">
                    <span class="text-xs uppercase tracking-widest opacity-60 whitespace-nowrap">Hours</span>
                    <input type="number" id="hours" value="1" step="0.25" class="input input-bordered input-md w-full" oninput="window.calculate()" />
                </div>

                <div class="flex items-center gap-3 w-full">
                    <span class="text-xs uppercase tracking-widest opacity-60 whitespace-nowrap">Total Labor</span>
                    <div class="join w-full">
                        <span class="join-item btn btn-md no-animation bg-base-200 border-base-300 pointer-events-none ">$</span>
                        <div class="join-item input input-bordered flex items-center bg-base-100 w-full" id="totalLaborDisplay">65.00</div>
                    </div>
                </div>
                        </div>

            <div class="divider my-8 text-xs uppercase tracking-widest opacity-40">Markup & Price Recommendation</div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6 bg-base-200 rounded-2xl">
                <div class="form-control w-full md:w-1/2">
                    <label class="label"><span class="label-text text-xs uppercase tracking-widest opacity-60">Markup (%)</span></label>
                    <input type="number" id="markup" value="50" class="mb-4 input input-bordered input-md w-full" oninput="window.calculate()" />
                    <label class="label"><span class="label-text text-xs uppercase tracking-widest opacity-60">Comission (%)</span></label>
                    <input type="number" id="comission" value="10" class="input input-bordered input-md w-full" oninput="window.calculate()" />
                </div>

                <div class="bg-neutral text-neutral-content p-6 rounded-xl flex flex-col justify-center shadow-inner">
                    <div class="flex justify-between text-sm opacity-70 mb-1 font-mono">
                        <span>COGS excl. comission:</span>
                        <span>$<span id="totalCogs">0.00</span></span>
                    </div>
                    <div class="flex justify-between text-sm opacity-70 mb-1 font-mono">
                        <span>Comission:</span>
                        <span>$<span id="calculatedComission">0.00</span></span>
                    </div>
                    <div class="flex justify-between text-sm opacity-70 mb-1 font-mono">
                        <span>Total COGS:</span>
                        <span>$<span id="totalCogsInclComission">0.00</span></span>
                    </div>
                    <h3 class="text-lg font-bold border-t border-neutral-content/20 pt-2">Recommended Price</h3>
                    <p class="text-5xl font-black text-accent leading-none mt-2">$<span id="finalPrice">0.00</span></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
